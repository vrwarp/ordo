name: Docker build (dry run)

# Builds the hub image for every pull request, for both platforms the publish workflow ships, and pushes
# nothing. A Dockerfile, dependency or build change that breaks the image fails here, before the merge
# that would publish it (docker-publish.yml). Needs no secrets, so it also runs for pull requests from forks.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request replaces the build in progress.
concurrency:
  group: docker-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ordo-hub:pr-${{ github.event.pull_request.number || 'manual' }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number || 'manual' }}
          # Reads the cache the publish workflow writes on main; writes its own layers for this branch.
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker-pr-${{ github.event.pull_request.number || 'manual' }},mode=max
      # The amd64 image is loaded and started once, so a runtime break (a missing system tool, a bundle
      # that does not start) fails too, not only a build break.
      - name: Load the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ordo-hub:smoke
          cache-from: |
            type=gha,scope=docker
            type=gha,scope=docker-pr-${{ github.event.pull_request.number || 'manual' }}
      - name: The image's size
        run: |
          # Printed, not enforced: design/22 sets a target under 1.5 GB for the image (uncompressed, linux/amd64).
          size=$(docker image inspect ordo-hub:smoke --format '{{.Size}}')
          echo "ordo-hub:smoke (linux/amd64): $size bytes, about $((size / 1000000)) MB"
          if [ "$size" -gt 1500000000 ]; then
            echo "::warning::The image is larger than design/22's target of 1.5 GB ($size bytes)."
          fi
      - name: Start the image and wait for its health check
        run: |
          docker run -d --name ordo-smoke -e ORDO_DEV_PIN=246810 -p 8080:8080 ordo-hub:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "hub is up"
              curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "operator app served"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The image did not answer its health check within 2 minutes."
          docker logs ordo-smoke
          exit 1
      - name: The PowerPoint renderers start inside the image
        run: |
          # LibreOffice (default) and headless Chromium for pptx-preview, as the hub runs them (no sandbox).
          docker exec ordo-smoke soffice --version
          docker exec ordo-smoke sh -c 'chromium --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null'
          echo "renderers start"
      - name: The Chinese, Japanese and Korean face inside the image
        run: |
          # fonts-noto-cjk's Sans collection (Dockerfile): fontconfig gives it for Hangul, its Serif collections are
          # left out and the dpkg rule that left them out is gone, its copyright file is kept, and the hub's start log
          # names it as the face it measures table cells with (design/27 §10) for each of the four scripts the hub
          # looks a face up for (apps/hub/src/pptx/systemFaces.ts): Han, Hiragana, Katakana and Hangul, not Han alone.
          face=$(docker exec ordo-smoke fc-match -f '%{file}' ':charset=ac00')
          echo "fontconfig's face for Hangul: $face"
          if [ "$face" != /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "::error::fontconfig does not give Noto Sans CJK for Hangul inside the image."; exit 1
          fi
          if docker exec ordo-smoke sh -c 'ls /usr/share/fonts/opentype/noto/NotoSerifCJK-*' 2>/dev/null; then
            echo "::error::The Serif CJK collections should be left out (Dockerfile)."; exit 1
          fi
          if docker exec ordo-smoke test -e /etc/dpkg/dpkg.cfg.d/ordo-noto-cjk-sans; then
            echo "::error::The dpkg rule that leaves out the Serif CJK collections should not stay in the image."; exit 1
          fi
          if ! docker exec ordo-smoke test -f /usr/share/doc/fonts-noto-cjk/copyright; then
            echo "::error::fonts-noto-cjk's copyright file is missing from the image."; exit 1
          fi
          line=""
          for i in $(seq 1 30); do
            line=$(docker logs ordo-smoke 2>&1 | grep 'system faces: ' || true)
            if [ -n "$line" ]; then break; fi
            sleep 2
          done
          echo "the hub's 'system faces' line: ${line:-none logged}"
          for script in Han Hiragana Katakana Hangul; do
            if ! printf '%s\n' "$line" | grep -q "[:,] $script NotoSansCJK-Regular.ttc"; then
              echo "::error::The hub's start log does not name the image's CJK face for $script (its 'system faces' line)."
              exit 1
            fi
          done
          echo "the hub measures CJK table cells in Han, Hiragana, Katakana and Hangul with Noto Sans CJK"
      - name: The packages' copyright notices are in the image
        run: |
          # Dockerfile: the runtime stage keeps every package's copyright file under /usr/share/doc (a link to another
          # package's folder counts). Lists the packages without one and fails only when one of the product's own
          # packages is among them (ffmpeg, LibreOffice, Chromium, poppler and tini): the base image's packages and
          # their dependencies are listed, not enforced.
          missing=$(docker exec ordo-smoke sh -c 'dpkg-query -W -f="\${Package}\n" | while read -r p; do [ -e "/usr/share/doc/$p/copyright" ] || echo "$p"; done')
          echo "packages without a copyright file: $(printf '%s\n' "$missing" | grep -c . || true)"
          printf '%s\n' "$missing" | head -50
          fail=0
          for p in ffmpeg libavcodec59 libreoffice-core libreoffice-common chromium chromium-common poppler-utils tini; do
            if printf '%s\n' "$missing" | grep -qx "$p"; then
              echo "::error::$p has no copyright file in the image (Dockerfile keeps every package's)."
              fail=1
            fi
          done
          [ "$fail" = 0 ]
      - name: Container log
        if: always()
        run: docker logs ordo-smoke 2>&1 | tail -50 || true
