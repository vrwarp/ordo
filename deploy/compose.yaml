# ordo hub on the Synology NAS (Container Manager → Project). See deploy/README.md.
services:
  ordo-hub:
    image: vrwarp/ordo-hub:v0.1.0
    container_name: ordo-hub
    restart: unless-stopped
    environment:
      ORDO_DOMAIN: venue.synology.me        # your DDNS name; role hosts are op., hub., stage., out1..6.
      ORDO_TRUSTED_PROXY: 172.16.0.0/12     # DSM reverse proxy source on the Docker bridge
      ORDO_TZ: America/Los_Angeles          # venue time zone (nightly backup at 03:00)
      ORDO_PORT: "8080"
    volumes:
      - /volume1/docker/ordo/data:/data
      # Optional: a read-only ProPresenter library folder for POST /import/pro7 { path: "/import/..." }
      # - /volume1/ProPresenter:/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits: { memory: 4g }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
