name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Advisories in third-party packages must not block an unrelated merge; the weekly audit
      # workflow (.github/workflows/audit.yml) reports them on its own schedule.
      - name: Audit dependencies (advisory only)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # iPad editing (design/15): the webkit-ipad and webkit-ipad-portrait projects run in the same `pnpm e2e`.
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: End-to-end tests (Chromium venue PC, WebKit iPad)
        run: pnpm e2e
        env:
          ORDO_CI: "1"
      - name: Golden images of the text rasterizer
        run: pnpm --filter @ordo/renderer golden
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ordo-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
