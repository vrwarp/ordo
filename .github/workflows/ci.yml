name: CI

# Pull requests, and merges to main (a merge is a push to main). Pushes to other branches do not run CI
# on their own: open a pull request (or run it by hand) to check a branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Five jobs side by side (design/23 "CI"): lint, types, unit tests and the builds (check, 25 minutes); the
  # end-to-end suite in two shards (e2e, 90 minutes: its limit counts the set-up of a slow runner, see there) and
  # the phone and Android tablet projects (e2e-phones, 40 minutes); the renderer goldens in a pinned container
  # (goldens); the fidelity ratchets (fidelity).
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline and bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The browser unit tests (*.browser.test.ts, the harness's NativeRenderer, pptx-preview) drive
      # Playwright's Chromium; under CI they fail without it rather than skip (tools/find-chromium.ts).
      - name: Playwright's Chromium for the browser unit tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (each app's initial JavaScript against tools/bundle-baseline.json, +8 % at most; the operator's compact first load at most 600 KB gzip, with no editor, live or output code)
        run: node tools/bundle-report.mjs --check --json test-results/bundle.json
      # The GitHub Pages demo (apps/demo); e2e/pages-demo.spec.ts serves and drives it.
      - run: pnpm build:pages
      # Advisories in third-party packages must not block an unrelated merge; the weekly audit
      # workflow (.github/workflows/audit.yml) reports them on its own schedule.
      - name: Audit dependencies (advisory only)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    # The limit counts the job's set-up too (the system packages and both Playwright browsers). On a runner
    # with a slow mirror that took 26 to 34 minutes on three attempts at one shard (the other shard's runner
    # needed about one to three), so a limit of 35 minutes was spent before the first test. Sub-wave 2 of the
    # follow-up pull request grew the suite to 169 tests in these three projects: Playwright splits them at a
    # group boundary into 91 (shard 1) and 78 (shard 2), which took 16.6 and 20.1 minutes of test time on the
    # integration machine (12.2 and 13.3 before; the sw2-seams file, in shard 2, takes about 20 seconds there, on
    # four CPUs and on two, because it starts its browser without a GPU: a runner of two CPUs took 8 to 12 minutes
    # for it with the GPU process). A runner took 1.65 times that machine's time for shard 2 (21.9 minutes of tests
    # there, 13.3 here), so shard 2 is about 33 minutes of tests: with the usual 2.5 minutes of set-up the job ends
    # near 36, with a slow runner's 24 to 34 it is 57 to 67, so a limit of 60 could be spent again. A retry of a
    # failing test adds its time again.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline and bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # iPad editing (design/15): the webkit-ipad and webkit-ipad-portrait projects run in the same `pnpm e2e`.
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: End-to-end tests (Chromium venue PC, WebKit iPad)
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --project=chromium --project=webkit-ipad --project=webkit-ipad-portrait
        env:
          ORDO_CI: "1"
      # Traces, captures and the logs of the hubs the specs own (test-results/hub-<port>.log).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Phones and an Android tablet (design/28 §8, design/23 "CI"): WebKit iPhone 13 and Chromium Pixel 5 on
  # e2e/phone/, Chromium Galaxy Tab S4 on the iPad specs (the Android Chrome model: e2e/touchdevice.ts).
  e2e-phones:
    name: End-to-end, phones and Android tablet
    runs-on: ubuntu-24.04
    # The same two install steps as the e2e shards (the system packages and both Playwright browsers) count against
    # this limit, and a slow mirror took 26 to 34 minutes of them for a shard; its 61 tests take 5.4 minutes of test
    # time on the integration machine (about 9 on a runner).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline and bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end tests (WebKit iPhone, Chromium Android phone and tablet)
        run: pnpm e2e --project=webkit-iphone --project=chromium-android --project=chromium-tablet
        env:
          ORDO_CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-phones
          path: |
            playwright-report
            test-results
          retention-days: 7

  fidelity:
    name: Fidelity ratchets (ProPresenter 7, golden-pptx census)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The fonts the ProPresenter baseline was scored with: the runner's list and the golden faces.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter fonts-dejavu-core fonts-freefont-ttf fonts-ipafont-gothic
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: ProPresenter 7 synthetic visual fidelity ratchet
        run: pnpm --filter @ordo/pro7-fidelity start -- --corpus --out test-results/pro7-fidelity --baseline tools/pro7-fidelity/pro7-baseline.json --ratchet
      # Every shown slide of the public corpus keeps its class, native and in the hub; no deck goes missing.
      - name: golden-pptx census ratchet
        if: success() || failure()
        run: pnpm --filter @ordo/pptx-fidelity census:ratchet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-results
          path: |
            test-results/pro7-fidelity
            test-results/census-golden.jsonl
            test-results/census-ratchet.json
          retention-days: 7

  # The renderer's golden images are drawn and compared in one pinned image, here and on a developer machine
  # (tools/golden-docker.sh): text rasterises differently on another machine, so the expected PNGs belong to
  # this image (design/23 "Golden images"). A failing or new case is uploaded as the artifact golden-images;
  # tools/golden-from-artifact.sh adopts its pictures.
  goldens:
    name: Goldens (pinned container)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The runner's font list and the faces the golden images were drawn with (golden/expected/meta.json; a
      # missing one fails the run). Keep in step with tools/golden-docker.sh.
      - name: Fonts
        run: apt-get update && apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter fonts-dejavu-core fonts-freefont-ttf fonts-ipafont-gothic
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Golden images of the text rasterizer
        run: pnpm --filter @ordo/renderer golden --strict
      - name: Late-loaded fonts take effect without a worker restart
        if: success() || failure()
        run: pnpm --filter @ordo/renderer late-font
      - name: Compositor golden (WebGPU on SwiftShader against Canvas 2D and the scene reference)
        if: success() || failure()
        run: pnpm --filter @ordo/renderer golden:compositor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-images
          path: |
            test-results/golden
            test-results/compositor-golden
          retention-days: 14
