name: GitHub Pages demo

# Builds the browser-only demo (apps/demo: the operator, output and stage apps with a service-worker hub and
# a sample service) and publishes it to GitHub Pages on every merge to main. In the repository settings,
# Pages → Build and deployment → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The sample service is made by the real hub, which processes media with ffmpeg.
      - name: System tools for the media pipeline
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The demo's VM hub (apps/demo/scripts/build-vm.ts) runs under unkernel, which needs Node 24; the rest of the
      # build stays on the repository's Node. It also downloads Alpine packages and the unkernel release.
      - name: Node 24 for the VM hub build
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/node24" node@24.22.3
      - run: pnpm build:pages
        env:
          ORDO_VM_NODE: ${{ runner.temp }}/node24/node_modules/.bin/node
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
