name: CI

# Pull requests, and merges to main (a merge is a push to main). Pushes to other branches do not run CI
# on their own: open a pull request (or run it by hand) to check a branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Four jobs side by side, none over about 35 minutes (design/23 "CI"): lint, types, unit tests and the builds
  # (check); the end-to-end suite in two shards (e2e); the renderer goldens in a pinned container (goldens);
  # the fidelity ratchets (fidelity).
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline and bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (each app's initial JavaScript against tools/bundle-baseline.json, +2 % at most)
        run: node tools/bundle-report.mjs --check --json test-results/bundle.json
      # The GitHub Pages demo (apps/demo); e2e/pages-demo.spec.ts serves and drives it.
      - run: pnpm build:pages
      # Advisories in third-party packages must not block an unrelated merge; the weekly audit
      # workflow (.github/workflows/audit.yml) reports them on its own schedule.
      - name: Audit dependencies (advisory only)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System tools for the media pipeline and bundled fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:pages
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # iPad editing (design/15): the webkit-ipad and webkit-ipad-portrait projects run in the same `pnpm e2e`.
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: End-to-end tests (Chromium venue PC, WebKit iPad)
        run: pnpm e2e --shard=${{ matrix.shard }}/2
        env:
          ORDO_CI: "1"
      # Traces, captures and the logs of the hubs the specs own (test-results/hub-<port>.log).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  fidelity:
    name: Fidelity ratchets (ProPresenter 7, golden-pptx census)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The fonts the ProPresenter baseline was scored with: the runner's list and the golden faces.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter fonts-dejavu-core fonts-freefont-ttf fonts-ipafont-gothic
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: ProPresenter 7 synthetic visual fidelity ratchet
        run: pnpm --filter @ordo/pro7-fidelity start -- --corpus --out test-results/pro7-fidelity --baseline tools/pro7-fidelity/pro7-baseline.json --ratchet
      # Every shown slide of the public corpus keeps its class, native and in the hub; no deck goes missing.
      - name: golden-pptx census ratchet
        if: success() || failure()
        run: pnpm --filter @ordo/pptx-fidelity census:ratchet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-results
          path: |
            test-results/pro7-fidelity
            test-results/census-golden.jsonl
            test-results/census-ratchet.json
          retention-days: 7

  # The renderer's golden images are drawn and compared in one pinned image, here and on a developer machine
  # (tools/golden-docker.sh): text rasterises differently on another machine, so the expected PNGs belong to
  # this image (design/23 "Golden images"). A failing or new case is uploaded as the artifact golden-images;
  # tools/golden-from-artifact.sh adopts its pictures.
  goldens:
    name: Goldens (pinned container)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The runner's font list and the faces the golden images were drawn with (golden/expected/meta.json; a
      # missing one fails the run). Keep in step with tools/golden-docker.sh.
      - name: Fonts
        run: apt-get update && apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-noto-core fonts-inter fonts-dejavu-core fonts-freefont-ttf fonts-ipafont-gothic
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Golden images of the text rasterizer
        run: pnpm --filter @ordo/renderer golden --strict
      - name: Late-loaded fonts take effect without a worker restart
        if: success() || failure()
        run: pnpm --filter @ordo/renderer late-font
      - name: Compositor golden (WebGPU on SwiftShader against Canvas 2D and the scene reference)
        if: success() || failure()
        run: pnpm --filter @ordo/renderer golden:compositor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-images
          path: |
            test-results/golden
            test-results/compositor-golden
          retention-days: 14
